name: One-time DOCX wording sync

on:
  push:
    paths:
      - '.github/workflows/sync_docx_wording.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align DOCX reliability terminology and scrub metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          import xml.etree.ElementTree as ET

          W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          CP = "http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
          DC = "http://purl.org/dc/elements/1.1/"
          DCT = "http://purl.org/dc/terms/"

          replacements = [
              ("A blind second-pass scoring exercise covered 12 reports (15% of the corpus) using a separate workflow that had not produced their first-pass scores.",
               "A separate repeat-scoring exercise covered 12 reports (15% of the corpus) using a workflow that had not produced their first-pass scores."),
              ("The blind 12-report second-pass scoring check produced",
               "The 12-report repeat-scoring check produced"),
              ("Pooled blind-recode weighted κ",
               "Pooled repeat-scoring weighted κ"),
              ("the 15% blind recode",
               "the 15% repeat-scoring check"),
              ("Twelve reports (15% of the corpus) were blindly re-coded.",
               "Twelve reports (15% of the corpus) were repeat-scored using the documented stability-check workflow."),
              ("Twelve reports (15% of the corpus) were blindly re-scored through a separate scoring workflow.",
               "Twelve reports (15% of the corpus) were repeat-scored through a separate scoring workflow that did not use the first-pass scores."),
              ("Twelve reports (15%) were blindly re-scored through a separate scoring workflow.",
               "Twelve reports (15%) were repeat-scored through a separate scoring workflow that did not use the first-pass scores."),
              ("structured manual content analysis of corporate annual reports",
               "deductive quantitative content analysis of corporate annual reports"),
          ]

          remove_core = {
              f"{{{DC}}}creator", f"{{{DC}}}title", f"{{{DC}}}subject",
              f"{{{DC}}}description", f"{{{CP}}}keywords",
              f"{{{CP}}}lastModifiedBy", f"{{{CP}}}revision",
              f"{{{CP}}}category", f"{{{CP}}}contentStatus",
              f"{{{CP}}}lastPrinted", f"{{{DCT}}}created", f"{{{DCT}}}modified",
          }

          changed_files = []
          replacement_count = 0
          for path in sorted(Path("deliverables").rglob("*.docx")):
              tmp = path.with_suffix(path.suffix + ".tmp")
              changed = False
              with zipfile.ZipFile(path, "r") as zin, zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      data = zin.read(item.filename)

                      if item.filename == "word/document.xml":
                          root = ET.fromstring(data)
                          local_changes = 0
                          for para in root.iter(f"{{{W}}}p"):
                              texts = list(para.iter(f"{{{W}}}t"))
                              if not texts:
                                  continue
                              joined = "".join((t.text or "") for t in texts)
                              revised = joined
                              for old, new in replacements:
                                  if old in revised:
                                      revised = revised.replace(old, new)
                                      local_changes += 1
                              if revised != joined:
                                  texts[0].text = revised
                                  for t in texts[1:]:
                                      t.text = ""
                          if local_changes:
                              data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                              replacement_count += local_changes
                              changed = True

                      elif item.filename == "docProps/core.xml":
                          root = ET.fromstring(data)
                          removed = False
                          for child in list(root):
                              if child.tag in remove_core:
                                  root.remove(child)
                                  removed = True
                          if removed:
                              data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                              changed = True

                      elif item.filename == "word/settings.xml":
                          root = ET.fromstring(data)
                          removed = False
                          for child in list(root):
                              if child.tag == f"{{{W}}}rsids":
                                  root.remove(child)
                                  removed = True
                          if removed:
                              data = ET.tostring(root, encoding="utf-8", xml_declaration=True)
                              changed = True

                      zout.writestr(item, data)

              if changed:
                  os.replace(tmp, path)
                  changed_files.append(str(path))
              else:
                  tmp.unlink(missing_ok=True)

          # Validate old phrases are absent from all DOCX document XML.
          old_phrases = [x[0] for x in replacements]
          failures = []
          for path in sorted(Path("deliverables").rglob("*.docx")):
              with zipfile.ZipFile(path, "r") as z:
                  if "word/document.xml" in z.namelist():
                      root = ET.fromstring(z.read("word/document.xml"))
                      text = "".join((t.text or "") for t in root.iter(f"{{{W}}}t"))
                      for old in old_phrases:
                          if old in text:
                              failures.append(f"{path}: residual phrase: {old}")
                  if "docProps/core.xml" in z.namelist():
                      root = ET.fromstring(z.read("docProps/core.xml"))
                      for child in root:
                          if child.tag in {f"{{{DC}}}creator", f"{{{CP}}}lastModifiedBy", f"{{{DC}}}description"}:
                              failures.append(f"{path}: residual metadata {child.tag}")

          if failures:
              raise SystemExit("\n".join(failures))

          print("DOCX files changed:", len(changed_files))
          print("Terminology replacements:", replacement_count)
          for p in changed_files:
              print(" -", p)
          print("DOCX_WORDING_AND_METADATA_AUDIT: PASS")
          PY

      - name: Commit synced DOCX binaries
        shell: bash
        run: |
          git config user.name "madireddyvasu"
          git config user.email "madireddyv@coventry.ac.uk"
          git add deliverables
          if git diff --cached --quiet; then
            echo "No DOCX changes required."
          else
            git commit -m "docs: align binary deliverables with final reliability terminology"
            git push
          fi
