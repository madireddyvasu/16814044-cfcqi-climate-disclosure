name: One-time verified corpus ingest
# refreshed trigger 2026-10-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/corpus_ingest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Configure Git LFS
        run: |
          git lfs install
          git lfs track "corpus/annual_reports/**/*.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and hash-verify 80 annual reports
        shell: python
        run: |
          import concurrent.futures
          import hashlib
          import json
          import pathlib
          import urllib.request

          manifest_path = pathlib.Path("corpus/TEMP_DOWNLOAD_MANIFEST.json")
          data = json.loads(manifest_path.read_text())
          files = data["files"]
          assert len(files) == 80, f"Expected 80 files, found {len(files)}"

          def download(item):
              path = pathlib.Path(item["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(item["url"], headers={"User-Agent": "CFCQI-Reproducibility/1.0"})
              with urllib.request.urlopen(req, timeout=180) as response, path.open("wb") as out:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest.lower() != item["sha256"].lower():
                  path.unlink(missing_ok=True)
                  raise RuntimeError(f"SHA-256 mismatch: {path} {digest} != {item['sha256']}")
              size = path.stat().st_size
              if int(size) != int(item["size"]):
                  raise RuntimeError(f"Size mismatch: {path} {size} != {item['size']}")
              return str(path), size

          total = 0
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex:
              futures = [ex.submit(download, item) for item in files]
              for i, fut in enumerate(concurrent.futures.as_completed(futures), 1):
                  path, size = fut.result()
                  total += size
                  print(f"[{i:02d}/80] verified {path} ({size:,} bytes)")

          print(f"Verified 80/80 reports; total bytes={total:,}")

      - name: Run repository corpus verifier
        run: |
          python3 -m pip install --quiet pandas
          python3 scripts/verify_corpus.py

      - name: Update repository status and remove temporary ingest material
        shell: python
        run: |
          import json
          import pathlib

          repo_manifest = pathlib.Path("REPOSITORY_MANIFEST.json")
          obj = json.loads(repo_manifest.read_text())
          obj["repo_version"] = "1.2.0"
          obj["corpus_included"] = True
          obj["corpus_strategy"] = "80 original annual-report PDFs stored under corpus/annual_reports via Git LFS; each file SHA-256 verified against the frozen manifest"
          obj["scope"] = "complete technical implementation, verified 80-report source corpus, datasets, evidence, analysis, results, reproducibility documentation and final research records"
          obj["excluded"] = "metadata-bearing Word submission binaries; annual-report copyrights remain with original issuers"
          repo_manifest.write_text(json.dumps(obj, indent=2) + "\n")

          readme = pathlib.Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "The repository contains the **verified source manifest, report index, SHA-256 hashes and corpus verification records**. The large issuer-owned PDF files are not stored in this GitHub repository; the technical implementation works from the locked evidence and analytical datasets.",
              "The repository contains the **complete verified 80-report source corpus**, together with the source manifest, report index, SHA-256 hashes and corpus verification records. The original PDFs are stored under `corpus/annual_reports/` via Git Large File Storage (Git LFS)."
          )
          text = text.replace(
              "The company annual reports used in the research remain copyright of their respective issuers. The GitHub repository currently stores their verified manifest/hashes rather than the PDF bytes; the reports are not relicensed by this repository.",
              "The company annual reports used in the research remain copyright of their respective issuers. The verified PDF bytes are included solely for academic reproducibility and are not relicensed by this repository."
          )
          text = text.replace(
              "If you maintain a local copy of the 80 annual reports under `corpus/annual_reports/`, run:",
              "After cloning with Git LFS, verify the included 80 annual reports with:"
          )
          readme.write_text(text)

          corpus_readme = pathlib.Path("corpus/README.md")
          ctext = corpus_readme.read_text()
          ctext = ctext.replace("The actual PDF files are not stored in the GitHub repository.", "The actual 80 verified PDF files are stored under `annual_reports/` via Git LFS.")
          corpus_readme.write_text(ctext)

          pathlib.Path("corpus/TEMP_DOWNLOAD_MANIFEST.json").unlink(missing_ok=True)
          pathlib.Path("corpus/GIT_LFS_UPLOAD_GUIDE.md").unlink(missing_ok=True)
          pathlib.Path(".github/workflows/corpus_ingest.yml").unlink(missing_ok=True)

      - name: Commit verified corpus
        run: |
          git add .gitattributes corpus README.md REPOSITORY_MANIFEST.json
          echo "LFS tracked PDFs:"
          git lfs ls-files | wc -l
          test "$(git lfs ls-files | wc -l | tr -d ' ')" = "80"
          git status --short
          git commit -m "corpus: add 80 SHA-256-verified annual reports via Git LFS"
          git push origin main
