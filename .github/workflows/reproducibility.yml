name: Reproducibility
on:
  push:
  pull_request:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Build deterministic evidence audit
        run: python scripts/08_build_evidence_audit.py
      - name: Run tests
        run: pytest -q
      - name: Run full analytical pipeline
        run: bash run_all.sh
